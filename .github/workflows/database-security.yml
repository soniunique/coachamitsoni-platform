name: Database Security Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/tests/**'
      - '.github/workflows/database-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap-security:
    name: pgTAP security suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify database test connection is configured
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL GitHub Actions secret is required for the production-schema security test."
            exit 1
          fi

      - name: Run database security tests against production schema
        run: supabase test db --db-url "$SUPABASE_DB_URL"
