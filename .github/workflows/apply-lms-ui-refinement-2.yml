name: Apply LMS UI refinement 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply stronger semantic action styling
        shell: bash
        run: |
          cat >> src/styles-learn.css <<'EOF'

/* LMS UI REFINEMENT 2 — stronger semantic action hierarchy — 04 September 2026 */
.learn-secondary-button:has(svg.lucide-pencil),.learn-primary-button:has(svg.lucide-pencil){
  min-height:38px;color:#dbeafe!important;border:1px solid rgba(59,130,246,.68)!important;
  background:linear-gradient(135deg,rgba(37,99,235,.48),rgba(29,78,216,.28))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px -18px rgba(59,130,246,1)!important;
}
.learn-secondary-button:has(svg.lucide-layers),.learn-primary-button:has(svg.lucide-layers){
  min-height:38px;color:#f3e8ff!important;border:1px solid rgba(139,92,246,.72)!important;
  background:linear-gradient(135deg,rgba(124,58,237,.58),rgba(109,40,217,.32))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px -18px rgba(139,92,246,1)!important;
}
.learn-secondary-button:has(svg.lucide-clipboard-check),.learn-primary-button:has(svg.lucide-clipboard-check){
  min-height:38px;color:#d1fae5!important;border:1px solid rgba(16,185,129,.72)!important;
  background:linear-gradient(135deg,rgba(5,150,105,.58),rgba(4,120,87,.32))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px -18px rgba(16,185,129,1)!important;
}
.learn-secondary-button:has(svg.lucide-bar-chart-3),.learn-primary-button:has(svg.lucide-bar-chart-3){
  min-height:38px;color:#ffedd5!important;border:1px solid rgba(245,158,11,.72)!important;
  background:linear-gradient(135deg,rgba(217,119,6,.58),rgba(180,83,9,.32))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px -18px rgba(245,158,11,1)!important;
}
.learn-secondary-button:has(svg.lucide-pencil):hover{background:linear-gradient(135deg,rgba(37,99,235,.78),rgba(59,130,246,.45))!important}
.learn-secondary-button:has(svg.lucide-layers):hover{background:linear-gradient(135deg,rgba(124,58,237,.82),rgba(139,92,246,.48))!important}
.learn-secondary-button:has(svg.lucide-clipboard-check):hover{background:linear-gradient(135deg,rgba(5,150,105,.82),rgba(16,185,129,.48))!important}
.learn-secondary-button:has(svg.lucide-bar-chart-3):hover{background:linear-gradient(135deg,rgba(217,119,6,.82),rgba(245,158,11,.48))!important}
.learn-secondary-button:has(svg.lucide-trash-2){
  min-height:34px;color:#fda4af!important;border-color:rgba(244,63,94,.34)!important;background:rgba(127,29,29,.14)!important;
}
.learn-secondary-button:has(svg.lucide-trash-2):disabled{color:#64748b!important;border-color:rgba(100,116,139,.16)!important;background:rgba(100,116,139,.045)!important;box-shadow:none!important;opacity:.7}
.learn-status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1;border:1px solid rgba(255,255,255,.12)}
.learn-status-published{color:#a7f3d0!important;border-color:rgba(16,185,129,.58)!important;background:rgba(5,150,105,.2)!important;box-shadow:0 0 18px -12px rgba(16,185,129,.9)}
.learn-status-draft{color:#fde68a!important;border-color:rgba(245,158,11,.58)!important;background:rgba(180,83,9,.18)!important}
.learn-status-archived{color:#cbd5e1!important;border-color:rgba(148,163,184,.3)!important;background:rgba(71,85,105,.18)!important}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles-learn.css
          git commit -m 'Strengthen LMS semantic action colors'
          git push
          git rm .github/workflows/apply-lms-ui-refinement-2.yml
          git commit -m 'Remove one-time LMS UI refinement workflow'
          git push
