name: Apply course player fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-course-player-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch course player
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/learn/courses/$slug.tsx')
          s = p.read_text()
          old = 'const loadedLessons = (ls || []) as Lesson[]; setLessons(loadedLessons);'
          new = '''const loadedLessons = (ls || []) as Lesson[];
          const moduleOrder = new Map(loadedModules.map((m, index) => [m.id, index]));
          const orderedLessons = [...loadedLessons].sort((a, b) => (moduleOrder.get(a.module_id) ?? 0) - (moduleOrder.get(b.module_id) ?? 0) || a.sort_order - b.sort_order);
          setLessons(orderedLessons);'''
          if old in s:
              s = s.replace(old, new, 1)
          old = 'if (!selected || progress < 100 || !enrolled) return;'
          new = 'if (!selected || selectedIndex !== lessons.length - 1 || !enrolled) return;'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('progress < 100', 'selectedIndex !== lessons.length - 1')
          for old in [
              'disabled={!enrolled || selectedIndex !== lessons.length - 1 || savingComplete}',
              'disabled={!enrolled || savingComplete || selectedIndex !== lessons.length - 1}',
              'disabled={!enrolled || selectedIndex !== lessons.length - 1}',
          ]:
              s = s.replace(old, 'disabled={!enrolled || savingComplete || findingNextCourse}')
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-course-player-fix.yml
          git add 'src/routes/learn/courses/$slug.tsx' .github/workflows/apply-course-player-fix.yml
          git commit -m 'Fix course player navigation and completion flow'
          git push