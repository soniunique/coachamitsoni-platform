name: Refine LMS UI hierarchy and status semantics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine course cards and semantic status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/styles-learn.css')
          css = css_path.read_text()
          marker = '/* LMS PREMIUM UI REFINEMENT — 04 September 2026 */'
          if marker not in css:
              css += r'''

          /* LMS PREMIUM UI REFINEMENT — 04 September 2026 */
          /* Keep semantic action colours; refine hierarchy, hover feedback and protected actions. */
          .learn-course-card{position:relative;overflow:hidden;border-color:rgba(148,163,184,.14);background:linear-gradient(145deg,rgba(30,41,59,.58),rgba(15,23,42,.38));box-shadow:0 18px 50px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.025);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease}
          .learn-course-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,rgba(34,211,238,.0),rgba(34,211,238,.45),rgba(139,92,246,.18),rgba(34,211,238,.0));opacity:0;transition:opacity .2s ease}
          .learn-course-card:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.24);background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.46));box-shadow:0 24px 60px -40px rgba(0,0,0,.95),0 0 0 1px rgba(34,211,238,.035)}
          .learn-course-card:hover::before{opacity:1}
          .learn-course-card h3{letter-spacing:-.01em}
          .learn-course-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:13px;font-size:11px;color:#94a3b8}
          .learn-course-meta span{display:inline-flex;align-items:center;gap:5px}
          .learn-course-meta span+span::before{content:"";width:3px;height:3px;border-radius:999px;background:rgba(148,163,184,.42);margin-right:2px}
          .learn-course-card .learn-status-pill{flex-shrink:0}
          .learn-course-card .learn-icon-button[disabled]{border-color:rgba(148,163,184,.1);color:#64748b;background:rgba(15,23,42,.35);opacity:.72}
          .learn-course-card .learn-icon-button[disabled]:hover{border-color:rgba(148,163,184,.1);color:#64748b;background:rgba(15,23,42,.35)}
          .learn-card > .learn-card{box-shadow:none}
          @media(prefers-reduced-motion:reduce){.learn-course-card{transition:none}.learn-course-card:hover{transform:none}}
          '''
              css_path.write_text(css)

          page_path = Path('src/routes/learn/manage/courses.tsx')
          text = page_path.read_text()

          old_card = 'className="rounded-2xl border border-white/10 bg-white/[0.03] p-5"'
          new_card = 'className="learn-course-card rounded-2xl border border-white/10 bg-white/[0.03] p-5"'
          if old_card in text and new_card not in text:
              text = text.replace(old_card, new_card, 1)

          old_status = '<span className={`learn-status-pill learn-status-${program.status}`}>{course.status}</span>'
          new_status = '<span className={`learn-status-pill learn-status-${course.status}`}>{course.status}</span>'
          text = text.replace(old_status, new_status)

          old_description = '<p className="mt-3 text-sm leading-6 text-slate-400">{course.description || "No description added yet."}</p>'
          new_description = '<p className="mt-3 text-sm leading-6 text-slate-400">{course.description || "No description added yet."}</p><div className="learn-course-meta" aria-label="Course summary"><span>{r?.modules ?? 0} module{(r?.modules ?? 0)===1?"":"s"}</span><span>{r?.lessons ?? 0} lesson{(r?.lessons ?? 0)===1?"":"s"}</span><span>{r?.assessmentExists?"Assessment":"No assessment"}</span></div>'
          if old_description in text and 'className="learn-course-meta"' not in text:
              text = text.replace(old_description, new_description, 1)

          page_path.write_text(text)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles-learn.css src/routes/learn/manage/courses.tsx
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Polish LMS course card hierarchy'
            git push
          fi

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/refine-lms-ui.yml || true
          git commit -m 'Remove one-time LMS UI refinement workflow' || true
          git push || true
