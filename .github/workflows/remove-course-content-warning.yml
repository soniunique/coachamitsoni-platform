name: One-time UI cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove persistent enrolled-content banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/learn/manage/course-content.$courseId.tsx')
          text = path.read_text()
          old = '{hasEnrollment&&<div className="learn-card mb-5 border border-amber-400/30 bg-amber-400/10 p-4 text-sm text-amber-200"><div className="font-semibold">Content history is protected</div><p className="mt-1 leading-6">{enrolledContentMessage}</p></div>}'
          if old not in text:
              raise SystemExit('Expected enrolled-content banner was not found; refusing to modify the file.')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/learn/manage/course-content.$courseId.tsx
          git rm .github/workflows/remove-course-content-warning.yml
          git commit -m 'Remove persistent enrolled content warning [skip ci]'
          git push