name: Refine published course status label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update status label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/learn/manage/courses.tsx')
          text = path.read_text()
          old = '{ready?"Ready to publish":"Needs attention"}'
          new = '{ready?(course.status==="published"?"Published":"Ready to publish"):"Needs attention"}'
          if old not in text:
              raise SystemExit('Expected status label was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/learn/manage/courses.tsx'
          git rm '.github/workflows/refine-course-status-label.yml'
          git commit -m 'Clarify published course status'
          git push
