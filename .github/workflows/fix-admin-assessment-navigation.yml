name: Fix admin assessment navigation

on:
  push:
    branches:
      - feature/student-assessment-results

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/student-assessment-results
          fetch-depth: 1

      - name: Add Assessment action to every admin course card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/learn/manage/courses.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { BookOpen, Layers, Loader2, Pencil, Plus, Trash2, X, BarChart3 } from "lucide-react";'
          new_import = 'import { BookOpen, ClipboardCheck, Layers, Loader2, Pencil, Plus, Trash2, X, BarChart3 } from "lucide-react";'
          if 'ClipboardCheck' not in text:
              if old_import not in text:
                  raise SystemExit('Expected lucide import was not found.')
              text = text.replace(old_import, new_import, 1)

          assessment = '<Link to="/learn/manage/assessment/$courseId" params={{ courseId: course.id }} className="learn-secondary-button"><ClipboardCheck size={16}/>Assessment</Link>'
          if 'to="/learn/manage/assessment/$courseId"' not in text:
              pattern = r'(<Link\b[^>]*>.*?Progress.*?</Link>)'
              text, count = re.subn(pattern, assessment + r'\1', text, flags=re.S)
              print(f'Inserted Assessment links: {count}')
              if count == 0:
                  raise SystemExit('Could not locate the course-card Progress action; no source changes made.')

          text = text.replace('className="flex gap-2"', 'className="flex flex-wrap gap-2"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source change
        run: |
          grep -q 'to="/learn/manage/assessment/$courseId"' src/routes/learn/manage/courses.tsx
          grep -q 'ClipboardCheck' src/routes/learn/manage/courses.tsx
          echo 'Assessment navigation verified.'

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/learn/manage/courses.tsx
          git rm .github/workflows/fix-admin-assessment-navigation.yml
          git commit -m "fix: add admin assessment navigation"
          git push origin HEAD:feature/student-assessment-results
