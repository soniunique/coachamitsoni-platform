name: LMS Content Dock Gap Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove LMS Content dock gap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/styles-learn.css")
          text = path.read_text(encoding="utf-8")
          rule = "/* COURSE PLAYER CONTENT DOCK GAP FIX — keep the main lesson and Content dock flush globally */\n.learn-course-player-shell .relative > .grid { gap: 0 !important; }\n"
          if "COURSE PLAYER CONTENT DOCK GAP FIX" not in text:
              anchor = "\n@media(max-width:1199px)"
              if anchor not in text:
                  raise SystemExit("Expected LMS styles anchor not found; no changes made.")
              text = text.replace(anchor, "\n" + rule + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lms-content-gap-fix.yml
          git add src/styles-learn.css
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "UX: remove LMS Content dock gap globally"
          git push origin HEAD:main
