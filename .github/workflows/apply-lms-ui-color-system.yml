name: Apply LMS UI color system

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply semantic LMS colors
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path('src/styles-learn.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* LMS SEMANTIC ACTION COLOR SYSTEM — 04 September 2026 */'
          if marker not in css:
              css += '''\n\n/* LMS SEMANTIC ACTION COLOR SYSTEM — 04 September 2026 */\n/*\n * Semantic color is reserved for meaning-bearing actions: edit, content,\n * assessment, progress and destructive actions. Primary CTAs remain brand-gradient.\n * The system is intentionally reusable across the LMS and works with existing\n * Lucide icons, so current feature behaviour and navigation are unchanged.\n */\n.learn-primary-button,.learn-secondary-button{position:relative;isolation:isolate}\n.learn-secondary-button:has(svg.lucide-pencil),\n.learn-primary-button:has(svg.lucide-pencil),\nbutton:has(svg.lucide-pencil).learn-secondary-button,\nbutton:has(svg.lucide-pencil).learn-primary-button{color:#bfdbfe;border-color:rgba(59,130,246,.42);background:linear-gradient(135deg,rgba(37,99,235,.28),rgba(30,64,175,.18));box-shadow:0 12px 32px -24px rgba(59,130,246,.9)}\n.learn-secondary-button:has(svg.lucide-pencil):hover,\n.learn-primary-button:has(svg.lucide-pencil):hover{color:#fff;border-color:rgba(96,165,250,.8);background:linear-gradient(135deg,rgba(37,99,235,.58),rgba(59,130,246,.3));filter:none}\n.learn-secondary-button:has(svg.lucide-layers),\n.learn-primary-button:has(svg.lucide-layers){color:#e9d5ff;border-color:rgba(139,92,246,.48);background:linear-gradient(135deg,rgba(124,58,237,.42),rgba(109,40,217,.22));box-shadow:0 12px 32px -24px rgba(139,92,246,.95)}\n.learn-secondary-button:has(svg.lucide-layers):hover,\n.learn-primary-button:has(svg.lucide-layers):hover{color:#fff;border-color:rgba(167,139,250,.85);background:linear-gradient(135deg,rgba(124,58,237,.68),rgba(139,92,246,.38));filter:none}\n.learn-secondary-button:has(svg.lucide-clipboard-check),\n.learn-primary-button:has(svg.lucide-clipboard-check){color:#bbf7d0;border-color:rgba(16,185,129,.48);background:linear-gradient(135deg,rgba(5,150,105,.42),rgba(16,185,129,.2));box-shadow:0 12px 32px -24px rgba(16,185,129,.9)}\n.learn-secondary-button:has(svg.lucide-clipboard-check):hover,\n.learn-primary-button:has(svg.lucide-clipboard-check):hover{color:#fff;border-color:rgba(52,211,153,.85);background:linear-gradient(135deg,rgba(5,150,105,.68),rgba(16,185,129,.38));filter:none}\n.learn-secondary-button:has(svg.lucide-bar-chart-3),\n.learn-primary-button:has(svg.lucide-bar-chart-3){color:#fed7aa;border-color:rgba(245,158,11,.5);background:linear-gradient(135deg,rgba(217,119,6,.42),rgba(245,158,11,.2));box-shadow:0 12px 32px -24px rgba(245,158,11,.9)}\n.learn-secondary-button:has(svg.lucide-bar-chart-3):hover,\n.learn-primary-button:has(svg.lucide-bar-chart-3):hover{color:#fff;border-color:rgba(251,191,36,.88);background:linear-gradient(135deg,rgba(217,119,6,.7),rgba(245,158,11,.4));filter:none}\n.learn-secondary-button:has(svg.lucide-trash-2),\n.learn-primary-button:has(svg.lucide-trash-2){color:#fca5a5;border-color:rgba(248,113,113,.32);background:rgba(127,29,29,.16);box-shadow:none}\n.learn-secondary-button:has(svg.lucide-trash-2):hover,\n.learn-primary-button:has(svg.lucide-trash-2):hover{color:#fecaca;border-color:rgba(248,113,113,.62);background:rgba(127,29,29,.28);filter:none}\nbutton:has(svg.lucide-trash-2):disabled{color:#64748b;border-color:rgba(148,163,184,.12);background:rgba(148,163,184,.035);box-shadow:none;filter:none;transform:none}\n.learn-status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}\n.learn-status-pill.learn-status-published{color:#6ee7b7;border:1px solid rgba(16,185,129,.55);background:rgba(5,150,105,.16);box-shadow:0 8px 24px -18px rgba(16,185,129,.95)}\n.learn-status-pill.learn-status-draft{color:#fde68a;border:1px solid rgba(245,158,11,.42);background:rgba(217,119,6,.13)}\n.learn-status-pill.learn-status-archived{color:#cbd5e1;border:1px solid rgba(148,163,184,.28);background:rgba(100,116,139,.12)}\n.learn-card:hover{border-color:rgba(103,232,249,.18);box-shadow:0 26px 70px -44px rgba(0,0,0,.95),0 0 0 1px rgba(34,211,238,.025)}\n@media(prefers-reduced-motion:reduce){.learn-card{transition:none}}\n'''
              css_path.write_text(css, encoding='utf-8')

          page = Path('src/routes/learn/manage/courses.tsx')
          text = page.read_text(encoding='utf-8')
          old = 'className="rounded-full border border-white/10 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wide text-slate-300"'
          text = text.replace(old, 'className={`learn-status-pill learn-status-${program.status}`}').replace(old, 'className={`learn-status-pill learn-status-${course.status}`}')
          page.write_text(text, encoding='utf-8')
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles-learn.css src/routes/learn/manage/courses.tsx
          git diff --cached --quiet || git commit -m "Apply semantic LMS action colors"
          git rm .github/workflows/apply-lms-ui-color-system.yml
          git commit -m "Remove one-time UI color workflow"
          git push