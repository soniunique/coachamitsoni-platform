name: Apply global LMS design system
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ui-system]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global LMS UI system
        shell: python
        run: |
          from pathlib import Path
          css = Path('src/styles-learn.css')
          text = css.read_text()
          marker = '/* GLOBAL LMS DESIGN SYSTEM v1 — 04 September 2026 */'
          if marker not in text:
              text += r'''

/* GLOBAL LMS DESIGN SYSTEM v1 — 04 September 2026 */
:root{
  --lms-bg:#06101e;--lms-surface:#0d1b2e;--lms-surface-2:#111f32;--lms-border:rgba(148,163,184,.18);
  --lms-text:#f1f5f9;--lms-muted:#94a3b8;--lms-cyan:#22d3ee;--lms-violet:#8b5cf6;
  --lms-blue:#60a5fa;--lms-green:#34d399;--lms-amber:#fbbf24;--lms-red:#fb7185;
}
.learn-content{max-width:1220px;padding:28px 24px 48px}
.learn-topbar{min-height:64px;padding:0 24px}
.learn-card{border-radius:16px;border-color:var(--lms-border);background:linear-gradient(145deg,rgba(20,34,54,.72),rgba(10,21,37,.62));box-shadow:0 18px 55px -42px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.025)}
.learn-card:hover{border-color:rgba(103,232,249,.2)}
.learn-eyebrow{font-size:10px;line-height:14px;letter-spacing:.18em}
.learn-primary-button,.learn-secondary-button{min-height:36px;padding:8px 14px;border-radius:10px;font-size:12px;line-height:18px;font-weight:650}
.learn-primary-button{box-shadow:0 12px 30px -22px rgba(34,211,238,.85),0 10px 28px -22px rgba(139,92,246,.75)}
.learn-secondary-button{border-color:rgba(148,163,184,.2);background:rgba(255,255,255,.045)}
.learn-secondary-button:focus-visible,.learn-primary-button:focus-visible,.learn-icon-button:focus-visible,.learn-menu-button:focus-visible,.learn-mobile-close:focus-visible,.learn-input:focus-visible{outline:2px solid rgba(103,232,249,.9);outline-offset:2px}
.learn-secondary-button:has(svg.lucide-pencil){color:#bfdbfe;border-color:rgba(59,130,246,.55);background:linear-gradient(135deg,rgba(37,99,235,.3),rgba(30,64,175,.16))}
.learn-secondary-button:has(svg.lucide-layers){color:#e9d5ff;border-color:rgba(139,92,246,.55);background:linear-gradient(135deg,rgba(124,58,237,.42),rgba(109,40,217,.2))}
.learn-secondary-button:has(svg.lucide-clipboard-check){color:#bbf7d0;border-color:rgba(16,185,129,.55);background:linear-gradient(135deg,rgba(5,150,105,.4),rgba(16,185,129,.18))}
.learn-secondary-button:has(svg.lucide-bar-chart-3){color:#fed7aa;border-color:rgba(245,158,11,.55);background:linear-gradient(135deg,rgba(217,119,6,.4),rgba(245,158,11,.18))}
.learn-secondary-button:has(svg.lucide-trash-2){color:#fda4af;border-color:rgba(244,63,94,.48);background:rgba(159,18,57,.16)}
.learn-secondary-button:has(svg.lucide-pencil):hover{border-color:rgba(96,165,250,.85);background:rgba(37,99,235,.42)}
.learn-secondary-button:has(svg.lucide-layers):hover{border-color:rgba(167,139,250,.9);background:rgba(124,58,237,.55)}
.learn-secondary-button:has(svg.lucide-clipboard-check):hover{border-color:rgba(52,211,153,.9);background:rgba(5,150,105,.55)}
.learn-secondary-button:has(svg.lucide-bar-chart-3):hover{border-color:rgba(251,191,36,.9);background:rgba(217,119,6,.55)}
.learn-secondary-button:has(svg.lucide-trash-2):hover{border-color:rgba(251,113,133,.8);background:rgba(159,18,57,.3)}
.learn-card article .learn-secondary-button,.learn-card > div > article .learn-secondary-button{min-height:34px}
.learn-status-pill{min-height:23px;padding:4px 9px;border-radius:999px;font-size:10px;line-height:14px;font-weight:800;letter-spacing:.08em}
.learn-status-upcoming{color:#93c5fd!important;border-color:rgba(59,130,246,.55)!important;background:rgba(37,99,235,.16)!important}
.learn-status-live{color:#6ee7b7!important;border-color:rgba(16,185,129,.6)!important;background:rgba(5,150,105,.18)!important}
.learn-status-attended{color:#6ee7b7!important;border-color:rgba(16,185,129,.6)!important;background:rgba(5,150,105,.18)!important}
.learn-status-registered{color:#93c5fd!important;border-color:rgba(59,130,246,.55)!important;background:rgba(37,99,235,.16)!important}
.learn-status-waitlisted{color:#fde68a!important;border-color:rgba(245,158,11,.6)!important;background:rgba(180,83,9,.18)!important}
.learn-status-cancelled{color:#cbd5e1!important;border-color:rgba(148,163,184,.32)!important;background:rgba(71,85,105,.18)!important}
.learn-status-completed{color:#a5b4fc!important;border-color:rgba(99,102,241,.58)!important;background:rgba(79,70,229,.18)!important}
.learn-status-published{color:#6ee7b7!important;border-color:rgba(16,185,129,.6)!important;background:rgba(5,150,105,.18)!important}
.learn-status-created{color:#93c5fd!important;border-color:rgba(59,130,246,.58)!important;background:rgba(37,99,235,.18)!important}
.learn-status-refunded{color:#67e8f9!important;border-color:rgba(34,211,238,.55)!important;background:rgba(8,145,178,.18)!important}
.learn-status-paid,.learn-status-active{color:#6ee7b7!important;border-color:rgba(16,185,129,.6)!important;background:rgba(5,150,105,.18)!important}
.learn-status-failed,.learn-status-error,.learn-status-rejected{color:#fda4af!important;border-color:rgba(244,63,94,.58)!important;background:rgba(159,18,57,.18)!important}
.learn-status-draft,.learn-status-pending,.learn-status-refund-pending{color:#fde68a!important;border-color:rgba(245,158,11,.62)!important;background:rgba(180,83,9,.2)!important}
.learn-status-archived,.learn-status-none{color:#cbd5e1!important;border-color:rgba(148,163,184,.32)!important;background:rgba(71,85,105,.18)!important}
.learn-meta{min-height:30px;padding:5px 9px;font-size:11px;color:#a9b8ca;border-color:rgba(148,163,184,.17);background:rgba(255,255,255,.035)}
.learn-input{min-height:40px;border-radius:10px;font-size:14px}
button:disabled,.learn-secondary-button:disabled,.learn-primary-button:disabled{cursor:not-allowed}
.learn-primary-button:disabled{filter:saturate(.45);opacity:.65;transform:none}
.learn-secondary-button:disabled{opacity:.55}
@media(max-width:1023px){.learn-content{padding:24px 18px 40px}}
@media(max-width:640px){.learn-content{padding:18px 12px 32px}.learn-primary-button,.learn-secondary-button{min-height:40px}}
@media(prefers-reduced-motion:reduce){.learn-card,.learn-primary-button,.learn-secondary-button{transition:none!important}}
'''
              css.write_text(text)

          # Make program pricing status badges use the global semantic system.
          p = Path('src/routes/learn/manage/program-pricing.tsx')
          t = p.read_text()
          old = '<span className="rounded-full border border-white/10 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wide text-slate-300">{program.status}</span>'
          new = '<span className={`learn-status-pill learn-status-${program.status.replace(/_/g,"-")}`}>{program.status}</span>'
          if old in t: p.write_text(t.replace(old,new))

          # Make workshop and registration states semantic and consistently shaped.
          p = Path('src/routes/learn/manage/workshops.tsx'); t = p.read_text()
          t = t.replace('<div className="learn-eyebrow">{w.status}</div>', '<span className={`learn-status-pill learn-status-${w.status.replace(/_/g,"-")}`}>{w.status}</span>')
          p.write_text(t)
          p = Path('src/routes/learn/manage/workshop-registrations.tsx'); t = p.read_text()
          t = t.replace('<div className="learn-eyebrow">{workshop.status}</div>', '<span className={`learn-status-pill learn-status-${workshop.status.replace(/_/g,"-")}`}>{workshop.status}</span>')
          t = t.replace('<span className="learn-secondary-button">{row.status}</span>', '<span className={`learn-status-pill learn-status-${row.status.replace(/_/g,"-")}`}>{row.status}</span>')
          p.write_text(t)
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles-learn.css src/routes/learn/manage/program-pricing.tsx src/routes/learn/manage/workshops.tsx src/routes/learn/manage/workshop-registrations.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Polish global LMS UI components [skip ui-system]"
          git push