name: Apply global LMS polish

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-global-lms-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[global-lms-polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global LMS visual system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles-learn.css')
          css = p.read_text()
          marker = '/* GLOBAL LMS POLISH — 04 September 2026 */'
          if marker not in css:
              css += r'''

/* GLOBAL LMS POLISH — 04 September 2026 */
:root{--lms-cyan:#22d3ee;--lms-violet:#8b5cf6;--lms-blue:#3b82f6;--lms-green:#10b981;--lms-amber:#f59e0b;--lms-red:#ef4444;--lms-slate:#64748b}
.learn-primary-button,.learn-secondary-button{min-height:38px;padding:8px 13px;border-radius:10px;line-height:1;letter-spacing:.005em;outline:none}
.learn-primary-button:focus-visible,.learn-secondary-button:focus-visible,.learn-icon-button:focus-visible,.learn-menu-button:focus-visible,.learn-mobile-close:focus-visible,.learn-nav-item:focus-visible{outline:2px solid rgba(103,232,249,.9);outline-offset:2px}
.learn-secondary-button:has(svg.lucide-trash-2){min-width:0!important;width:auto!important;height:auto!important;align-self:flex-start;flex:none!important;color:#fda4af;border-color:rgba(244,63,94,.42);background:rgba(244,63,94,.07);box-shadow:none}
.learn-secondary-button:has(svg.lucide-trash-2):hover{color:#ffe4e6;border-color:rgba(251,113,133,.8);background:rgba(244,63,94,.16)}
.learn-secondary-button:has(svg.lucide-pencil){min-width:0!important;width:auto!important;height:auto!important;align-self:flex-start;flex:none!important}
.learn-tab-list{display:flex;align-items:center;gap:4px;padding:5px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.025);overflow-x:auto}
.learn-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:8px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:#8191a7;font-size:12px;font-weight:700;white-space:nowrap;transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
.learn-tab:hover{color:#dbeafe;background:rgba(255,255,255,.045)}
.learn-tab.active,.learn-tab[aria-selected=true]{color:#fff;border-color:rgba(34,211,238,.28);background:linear-gradient(135deg,rgba(34,211,238,.13),rgba(139,92,246,.12));box-shadow:0 8px 24px -18px rgba(34,211,238,.8),inset 0 -2px 0 rgba(34,211,238,.9)}
.learn-tab:focus-visible{outline:2px solid rgba(103,232,249,.9);outline-offset:1px}
/* Existing tab markup gets the same visual treatment without changing behaviour. */
.learn-card > .flex.border-b.border-white\/10 > button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:11px 18px;border:1px solid transparent!important;border-radius:9px 9px 0 0!important;color:#8191a7!important;background:transparent!important;font-size:12px;font-weight:700;transition:color .18s,background .18s,box-shadow .18s}
.learn-card > .flex.border-b.border-white\/10 > button:hover{color:#dbeafe!important;background:rgba(255,255,255,.035)!important}
.learn-card > .flex.border-b.border-white\/10 > button[class*="border-cyan-300"]{color:#fff!important;background:linear-gradient(135deg,rgba(34,211,238,.11),rgba(139,92,246,.09))!important;box-shadow:inset 0 -2px 0 #22d3ee}
.learn-course-card{position:relative;overflow:hidden;border-color:rgba(103,232,249,.14);background:linear-gradient(145deg,rgba(20,39,64,.76),rgba(8,21,38,.88));box-shadow:0 20px 60px -40px #000,0 0 0 1px rgba(34,211,238,.025)}
.learn-course-card:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.28);box-shadow:0 28px 70px -44px #000,0 0 30px -28px rgba(34,211,238,.45)}
.learn-card table{border-collapse:separate;border-spacing:0;width:100%}
.learn-card thead th{height:44px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.09);color:#7890ad;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.learn-card tbody tr{transition:background .16s}
.learn-card tbody tr:hover{background:rgba(34,211,238,.035)}
.learn-card tbody td{padding:12px;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px;vertical-align:middle}
.learn-card tbody tr:last-child td{border-bottom:0}
.learn-meta{font-size:11px;color:#9fb0c5}
.learn-status-pill{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:4px 9px;border-radius:999px;border:1px solid transparent;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;line-height:1}
.learn-status-published,.learn-status-paid,.learn-status-active{color:#6ee7b7;border-color:rgba(16,185,129,.38);background:rgba(16,185,129,.11)}
.learn-status-created,.learn-status-in-progress{color:#93c5fd;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.11)}
.learn-status-pending,.learn-status-refund-pending,.learn-status-draft{color:#fcd34d;border-color:rgba(245,158,11,.36);background:rgba(245,158,11,.11)}
.learn-status-refunded{color:#67e8f9;border-color:rgba(34,211,238,.36);background:rgba(34,211,238,.10)}
.learn-status-completed{color:#c4b5fd;border-color:rgba(139,92,246,.36);background:rgba(139,92,246,.11)}
.learn-status-failed,.learn-status-error,.learn-status-rejected,.learn-status-needs-attention{color:#fda4af;border-color:rgba(244,63,94,.38);background:rgba(244,63,94,.10)}
.learn-status-cancelled,.learn-status-archived,.learn-status-none{color:#cbd5e1;border-color:rgba(100,116,139,.36);background:rgba(100,116,139,.11)}
.learn-status-upcoming,.learn-status-registered{color:#93c5fd;border-color:rgba(59,130,246,.34);background:rgba(59,130,246,.10)}
.learn-status-attended{color:#6ee7b7;border-color:rgba(16,185,129,.36);background:rgba(16,185,129,.10)}
@media(max-width:640px){.learn-tab-list{width:100%}.learn-tab{flex:1 0 auto}.learn-card > .flex.border-b.border-white\/10{overflow-x:auto}.learn-card > .flex.border-b.border-white\/10 > button{min-width:max-content;padding-inline:14px}.learn-card tbody td,.learn-card thead th{padding:10px 8px}.learn-primary-button,.learn-secondary-button{min-height:40px}}
@media(prefers-reduced-motion:reduce){.learn-tab,.learn-card tbody tr,.learn-course-card{transition:none}.learn-course-card:hover{transform:none}}
'''
              p.write_text(css)
          PY

      - name: Commit global polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles-learn.css
          if git diff --cached --quiet; then
            echo 'No CSS changes needed.'
          else
            git commit -m 'Apply global LMS visual system [global-lms-polish]'
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-global-lms-polish.yml
          git add -u .github/workflows/apply-global-lms-polish.yml
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m 'Remove one-time global LMS polish workflow [global-lms-polish]'
            git push
          fi
